"on":
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    paths:
    - '**'
    - '!.github/workflows/porter_**'
    
name: Deploy to Preview Environment
jobs:
  porter-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set Github tag
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - name: Setup porter
      uses: porter-dev/setup-porter@v0.2.0
    - name: Build and deploy preview environment
      timeout-minutes: 30
      run: exec porter apply -f ./porter.yaml --preview
      env:
        PORTER_CLUSTER: 21
        PORTER_HOST: https://tyler.dev-porter.run
        PORTER_PROJECT: 1
        PORTER_APP_NAME: hex-preview
        PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
        PORTER_TOKEN: ${{ secrets.PORTER_APP_1_21 }}
        PORTER_PR_NUMBER: ${{ github.event.number }}
        PORTER_REPO_NAME: ${{ github.event.repository.name }}
